<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Library</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card narrow">
    <h1>Library login</h1>
    <p class="alert error" th:if="${param.error}">Wrong username or password.</p>
    <p class="alert ok" th:if="${param.logout}">You have been logged out.</p>
    <p class="alert ok" th:if="${param.registered}">Account created. You can log in now.</p>
    <form th:action="@{/login}" method="post">
       <label> Username  <input type="text" name="username" autofocus required> </label>

        <label>Password <input type="password" name="password" required></label>
        <button type="submit">Log in</button>
    </form>
    <p class="hint">No account yet? <a th:href="@{/register}">Register</a></p>
</main>
</body>
</html>
