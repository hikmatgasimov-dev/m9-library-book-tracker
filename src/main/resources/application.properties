spring.application.name=hibernate-practical

spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=hikmat
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Secured outbound API call: the key is read from the BOOK_API_KEY environment variable, never from the code
external-api.base-url=https://www.googleapis.com/books/v1
external-api.key=${BOOK_API_KEY:}
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=5s